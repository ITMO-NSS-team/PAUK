# Every service log under ~/pauk/logs: 3 files of 20 MB, the older ones compressed.
# copytruncate, because mongod and nginx keep their files open.
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/pauk (see deploy/README.md).
/home/asteb/pauk/logs/*/*.log {
    size 20M
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
