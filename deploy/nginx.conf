# One server for every site version: 8520 is the live site, 8521 the preview,
# 8522-8529 archived versions brought back up. Each port serves its own
# folder under /srv/site; the OSA reports are shared by all of them.
map $server_port $site_dir {
    8520    main;
    8521    preview;
    default archive-$server_port;
}

log_format pauk '$time_iso8601  site    $status  $request_method $request_uri '
                '$body_bytes_sent $request_time $remote_addr :$server_port';

server {
    listen 8520;
    listen 8521;
    listen 8522;
    listen 8523;
    listen 8524;
    listen 8525;
    listen 8526;
    listen 8527;
    listen 8528;
    listen 8529;

    root /srv/site/$site_dir;
    index index.html;

    access_log /var/log/pauk/access.log pauk;
    error_log /var/log/pauk/error.log warn;

    # The build ships .gz next to the text files; send those to browsers that take gzip.
    gzip_static on;

    location /reports/ {
        alias /srv/reports/;
    }

    location / {
        # An empty preview or a free archive slot answers 404, not an error.
        try_files $uri /index.html =404;
    }
}
