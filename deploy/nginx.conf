map $server_port $site_dir {
    8520    main;
    8521    preview;
    default archive-$server_port;
}

log_format pauk '$time_iso8601  site    $status  $request_method $request_uri '
                '$body_bytes_sent $request_time $remote_addr :$server_port';

server {
    listen 8520;
    listen 8521;
    listen 8522;
    listen 8523;
    listen 8524;
    listen 8525;
    listen 8526;
    listen 8527;
    listen 8528;
    listen 8529;

    root /srv/site/$site_dir;
    index index.html;

    access_log /var/log/pauk/access.log pauk;
    error_log /var/log/pauk/error.log warn;

    gzip_static on;

    location /reports/ {
        alias /srv/reports/;
    }

    location / {
        try_files $uri /index.html =404;
    }
}
