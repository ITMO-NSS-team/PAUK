# PAUK on one host. Run from the repository root:
#   docker compose --env-file <secrets>/pauk.env -f deploy/compose.yml up -d
# Paths and secrets come from that env file; see deploy/.env.example.

x-logging: &docker-logs
  driver: json-file
  options: {max-size: "10m", max-file: "1"}

x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: pauk:local
  user: "${PAUK_UID:-1004}:${PAUK_GID:-1004}"
  restart: unless-stopped
  logging: *docker-logs
  depends_on:
    mongo: {condition: service_healthy}
    neo4j: {condition: service_healthy}

x-app-env: &app-env
  MONGO_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/?authSource=admin
  MONGO_DB: ${MONGO_DB}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD}
  PAUK_LOG_DIR: /logs

services:
  mongo:
    # 4.x: the host CPU has no AVX, which mongo 5+ requires.
    image: mongo:4.4
    command: [--wiredTigerCacheSizeGB, "${MONGO_CACHE_GB:-6}", --logpath, /logs/mongod.log, --logappend]
    environment:
      # Setting a root user is what makes the image start mongod with --auth.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - ${PAUK_HOME}/db/mongo:/data/db
      - ${PAUK_HOME}/logs/mongo:/logs
    ports: ["27017:27017"]
    restart: unless-stopped
    logging: *docker-logs
    healthcheck:
      test: [CMD, mongo, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:2026.05.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-2g}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-2g}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1g}
      NEO4J_db_query_default__language: CYPHER_25
      NEO4J_dbms_security_procedures_unrestricted: apoc.*,gds.*
      NEO4J_dbms_security_procedures_allowlist: apoc.*,gds.*
    volumes:
      - ${PAUK_HOME}/db/neo4j/data:/data
      # APOC and GDS jars of the same version, not downloaded at start.
      - ${PAUK_HOME}/db/neo4j/plugins:/plugins
      - ${PAUK_HOME}/logs/neo4j:/logs
    ports: ["7474:7474", "7687:7687"]
    restart: unless-stopped
    logging: *docker-logs
    healthcheck:
      test: [CMD-SHELL, "bash -c '</dev/tcp/localhost/7687'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  admin:
    <<: *app
    command: [pauk, admin, serve, --port, "8505"]
    environment:
      <<: *app-env
      PAUK_SERVICE: admin
      PAUK_ADMIN_SECURE_COOKIE: ${PAUK_ADMIN_SECURE_COOKIE:-}
    volumes:
      - ${PAUK_HOME}/logs/admin:/logs
    ports: ["8505:8505"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8505/login', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker:
    <<: *app
    command: [pauk, admin, worker]
    # SIGTERM finishes the job in hand; a publish can take minutes.
    stop_grace_period: 5m
    environment:
      <<: *app-env
      PAUK_SERVICE: worker
      OPENALEX_API_KEY: ${OPENALEX_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_PROXY_URL: ${OPENROUTER_PROXY_URL:-}
      PAUK_LLM_MODEL: ${PAUK_LLM_MODEL:-}
      PAUK_AUTHOR_NAMES_CONCURRENCY: ${PAUK_AUTHOR_NAMES_CONCURRENCY:-8}
      PAUK_PERSON_RESOLUTION_CONCURRENCY: ${PAUK_PERSON_RESOLUTION_CONCURRENCY:-8}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PAUK_PDF_CRAWLER_URL: ${PAUK_PDF_CRAWLER_URL:-}
      PAUK_RUSSIAN_NAMES_FILE: /private/russian_names.csv
      PAUK_REPORTS_DIR: /reports
    extra_hosts: ["host.docker.internal:host-gateway"]
    # A dead worker process ends the container and the restart policy brings
    # it back; this checks what it cannot do without: reaching Mongo.
    healthcheck:
      test: [CMD, python, -c, "import os, pymongo; pymongo.MongoClient(os.environ['MONGO_URI'], serverSelectionTimeoutMS=5000).admin.command('ping')"]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - ${PAUK_HOME}/logs/worker:/logs
      - ${PAUK_HOME}/private:/private:ro
      - ${PAUK_HOME}/gui/${PAUK_STAND}:/app/data/gui
      - ${PAUK_ESSDATA}/pdf/${PAUK_STAND}:/app/data/pdf
      - ${PAUK_ESSDATA}/snapshots/${PAUK_STAND}:/app/data/cache
      - ${PAUK_ESSDATA}/runs/${PAUK_STAND}/audit:/app/data/audit
      - ${PAUK_ESSDATA}/runs/${PAUK_STAND}/osa:/app/data/osa
      - ${PAUK_ESSDATA}/reports/${PAUK_STAND}:/reports
      - uv-cache:/home/pauk/.cache/uv

  site:
    image: nginx:1.27.5-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PAUK_HOME}/site/${PAUK_STAND}:/srv/site:ro
      - ${PAUK_ESSDATA}/reports/${PAUK_STAND}:/srv/reports:ro
      - ${PAUK_HOME}/logs/site:/var/log/pauk
    ports: ["8520-8529:8520-8529"]
    restart: unless-stopped
    logging: *docker-logs
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8520/]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # OSA's environment, installed by uvx on the first report run.
  uv-cache:
