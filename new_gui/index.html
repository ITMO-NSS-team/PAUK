<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAUK</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }

      /* Общая раскладка страницы: сайдбар со списком слева, карта
         занимает всё оставшееся место. Общая тема light/dark и палитра
         (core/colors.ts) — отдельный следующий шаг, здесь только layout. */
      #app { display: flex; height: 100%; }
      #sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #c4c4c4; }
      #map { flex: 1; min-width: 0; }

      /* Кнопки переключения вкладок — по одной на каждый TabModule из
         features/tabs/index.ts. Пока только 3 (авторы/репозитории/
         публикации) — кнопок для поиска и здоровья БД нет, пока нет и
         самих вкладок. */
      #tab-buttons { display: flex; border-bottom: 1px solid #c4c4c4; }
      #tab-buttons button {
        flex: 1;
        padding: 10px 4px;
        border: none;
        background: none;
        font-size: 12px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      #tab-buttons button.tab-button--active { border-bottom-color: #3555e0; font-weight: 600; }

      /* Список карточек внутри активной вкладки — отрисовывается через
         core/render.ts::renderList(), см. features/tabs/authors.ts. */
      #tab-content { flex: 1; overflow-y: auto; }
      .tab-list-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid #eee;
        background: none;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .tab-list-item:hover { background: #f2f2f2; }
      .tab-list-item--selected { background: #e8ecfc; }
      .tab-list-item__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-list-item__meta { flex-shrink: 0; color: #616161; }

      /* Плавающая карточка выбранного узла поверх карты. */
      #panel {
        position: absolute;
        top: 12px;
        right: 12px;
        max-width: 320px;
        background: #ffffff;
        border: 1px solid #c4c4c4;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }
      #panel[hidden] { display: none; }
      #panel h3 { margin: 0 0 8px; font-size: 14px; }
      #panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
      #panel dt { color: #616161; }
      #panel dd { margin: 0; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <!-- data-tab на каждой кнопке — единственное, что нужно
             features/tabs/index.ts::mountTabs() для переключения. -->
        <nav id="tab-buttons">
          <button type="button" data-tab="1">Авторы</button>
          <button type="button" data-tab="2">Репозитории</button>
          <button type="button" data-tab="3">Публикации</button>
        </nav>
        <div id="tab-content"></div>
      </aside>
      <div id="map"></div>
    </div>
    <!-- Карточка с информацией о выбранном узле — заполняется через
         features/panels.ts::mountPanel(). Изначально скрыта (hidden),
         пока ничего не выбрано. -->
    <div id="panel" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
