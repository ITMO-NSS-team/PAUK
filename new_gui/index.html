<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAUK</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }

      /* Общая раскладка страницы: сайдбар со списком слева, карта
         занимает всё оставшееся место. Общая тема light/dark и палитра
         (core/colors.ts) — отдельный следующий шаг, здесь только layout. */
      #app { display: flex; height: 100%; }
      /* overflow-x: hidden — подстраховка: если внутри забудут про
         min-width: 0 на новом flex-элементе (как уже дважды случалось —
         см. .filter-row input и .tab-list-item__label ниже), контент
         обрежется по границе сайдбара, а не вылезет поверх карты. */
      #sidebar { width: 280px; flex-shrink: 0; overflow-x: hidden; display: flex; flex-direction: column; border-right: 1px solid #c4c4c4; }
      #map { flex: 1; min-width: 0; }

      /* Кнопки переключения вкладок — по одной на каждый TabModule из
         features/tabs/index.ts. "Здоровье БД" из старого GUI сознательно
         не переносим — для неё кнопки нет и не будет. */
      #tab-buttons { display: flex; border-bottom: 1px solid #c4c4c4; }
      #tab-buttons button {
        flex: 1;
        padding: 10px 4px;
        border: none;
        background: none;
        font-size: 12px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      #tab-buttons button.tab-button--active { border-bottom-color: #3555e0; font-weight: 600; }

      /* Регуляторы порогов фильтрации (features/filters.ts) — видны только
         для вкладок, у которых вообще есть фильтр (сейчас 1 и 3). */
      #filter-bar { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #c4c4c4; }
      #filter-bar[hidden] { display: none; }
      .filter-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .filter-row__label { flex-shrink: 0; color: #616161; }
      /* min-width: 0 обязателен — без него flex-элемент с nowrap-содержимым
         (тут это встроенный вид ползунка) не сжимается меньше своей
         "естественной" ширины и выталкивает строку за пределы сайдбара,
         когда подпись слева длинная (например "Мин. общих авторов"). */
      .filter-row input[type="range"] { flex: 1; min-width: 0; }
      .filter-row__value { flex-shrink: 0; min-width: 2.5em; text-align: right; }

      /* Список карточек внутри активной вкладки — отрисовывается через
         core/render.ts::renderList(), см. features/tabs/authors.ts. */
      #tab-content { flex: 1; overflow-y: auto; }
      .tab-list-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid #eee;
        background: none;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .tab-list-item:hover { background: #f2f2f2; }
      .tab-list-item--selected { background: #e8ecfc; }
      /* min-width: 0 — та же причина, что у .filter-row input выше: без
         него текст с white-space: nowrap не сжимается и вылезает за край
         строки (в поиске это выглядело как "буквы не отображаются" —
         текст на самом деле рисовался, просто за пределами видимой
         ширины сайдбара). */
      .tab-list-item__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-list-item__meta { flex-shrink: 0; color: #616161; }

      /* Вкладка "Поиск" (features/tabs/search.ts): поле ввода "прилипает"
         к верху при прокрутке списка результатов вниз (sticky), чтобы не
         приходилось скроллить обратно наверх, чтобы поправить запрос. */
      .search-input {
        position: sticky;
        top: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: none;
        border-bottom: 1px solid #c4c4c4;
        font-size: 13px;
        background: #ffffff;
      }
      .search-results .tab-list-item__label { white-space: normal; }

      /* Плавающая карточка выбранного узла поверх карты. */
      #panel {
        position: absolute;
        top: 12px;
        right: 12px;
        max-width: 320px;
        background: #ffffff;
        border: 1px solid #c4c4c4;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 13px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }
      #panel[hidden] { display: none; }
      #panel h3 { margin: 0 0 8px; font-size: 14px; }
      #panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
      #panel dt { color: #616161; }
      #panel dd { margin: 0; }

      /* Переключатель языка (app/main.ts) — сам текст ("EN"/"RU") ставит
         JS через core/i18n.ts::t("lang.toggle", lang), тут только позиция. */
      #lang-toggle {
        position: absolute;
        top: 12px;
        left: 292px;
        padding: 6px 10px;
        border: 1px solid #c4c4c4;
        border-radius: 6px;
        background: #ffffff;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <!-- data-tab на каждой кнопке — единственное, что нужно
             features/tabs/index.ts::mountTabs() для переключения. -->
        <nav id="tab-buttons">
          <button type="button" data-tab="1">Авторы</button>
          <button type="button" data-tab="2">Репозитории</button>
          <button type="button" data-tab="3">Публикации</button>
          <button type="button" data-tab="4">Поиск</button>
        </nav>
        <!-- Заполняется через features/filters.ts::mountFilters(); пусто и
             скрыто, пока не смонтирована активная вкладка с фильтром. -->
        <div id="filter-bar" hidden></div>
        <div id="tab-content"></div>
      </aside>
      <div id="map"></div>
    </div>
    <!-- Текст ("EN"/"RU") ставит app/main.ts при монтировании и при
         каждом клике — сам переключатель ничего не знает про язык. -->
    <button type="button" id="lang-toggle"></button>
    <!-- Карточка с информацией о выбранном узле — заполняется через
         features/panels.ts::mountPanel(). Изначально скрыта (hidden),
         пока ничего не выбрано. -->
    <div id="panel" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
