<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAUK</title>
    <style>
      /* Единая тёмная палитра ("Obsidian"-стиль) — единственное место, где
         живут цвета вёрстки, дальше везде var(--...). --surface совпадает с
         MAP_CONFIG.backgroundColor (#202020, core/config.ts) намеренно —
         сайдбар/панель и canvas графа читаются как один тон, а не два
         рассинхронизированных источника цвета (DOM-токены и canvas-конфиг
         остаются двумя разными механизмами не просто так, см. память
         проекта про design tokens — но значения выбраны совпадающими). */
      :root {
        --bg: #181818;
        --surface: #202020;
        --surface-2: #2a2a2a;
        --border: #333333;
        --text: #dcdcdc;
        --muted: #8a8a8a;
        --accent: #5c7cfa;
        --accent-soft: rgba(92, 124, 250, 0.18);
        --danger-bg: #2a1414;
        --danger-border: #e03131;
        --danger-text: #ffb3b3;
      }

      html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; color-scheme: dark; }
      body { background: var(--bg); color: var(--text); }

      /* Единое кольцо фокуса для клавиатурной навигации — раньше нигде на
         сайте не было ни одного :focus-visible, только браузерный дефолт
         (у Chrome он на тёмном фоне почти не виден). Один общий селектор
         на все интерактивные элементы, а не per-компонентный дубль —
         "чтобы человеку или агенту просто было находить" относится и к
         навигации с клавиатуры/через DOM, не только к мыши. */
      button:focus-visible, a:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* Общая раскладка страницы: сайдбар со списком слева, карта
         посередине, панель информации справа — все три одной высоты,
         карта занимает всё оставшееся место. НЕ прячется через
         display: none, пока показано меню, хотя features/start.ts и
         ставит на нём атрибут [hidden] (тот здесь намеренно не имеет
         визуального эффекта — специфичность `#app { display: flex }`
         выше специфичности браузерного правила для [hidden]): Sigma
         конструируется сразу после загрузки данных (app/main.ts), ей
         нужны настоящие ненулевые размеры #map в этот момент, а не
         схлопнутый до 0×0 контейнер. #menu — непрозрачный fixed-оверлей
         с более высоким z-index (см. ниже), поэтому меню всё равно
         визуально полностью перекрывает #app, тем же способом, что
         раньше делал #welcome-modal. */
      #app { display: flex; height: 100%; }
      /* overflow-x: hidden — подстраховка: если внутри забудут про
         min-width: 0 на новом flex-элементе (как уже дважды случалось —
         см. .filter-row input и .tab-list-item__label ниже), контент
         обрежется по границе сайдбара, а не вылезет поверх карты. */
      #sidebar { width: 280px; flex-shrink: 0; overflow-x: hidden; display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); }
      /* position: relative — точка отсчёта для map/build.ts::mountZoomDebug
         (position: absolute внутри), чтобы индикатор зума лежал поверх
         самой карты, а не всего viewport (в котором left:12px попал бы в
         область сайдбара). */
      #map { flex: 1; min-width: 0; position: relative; }

      /* Заголовок сайдбара — кликабелен, возвращает в меню
         (features/start.ts, store.set({ screen: "menu" })). Единственный
         путь назад в меню из обычного интерфейса. */
      #brand {
        display: block;
        width: 100%;
        padding: 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: none;
        color: var(--text);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: -0.02em;
        text-align: left;
        cursor: pointer;
      }
      #brand:hover { background: var(--surface-2); }

      /* Кнопка входа в глобальный поиск (features/globalSearch.ts) — тот
         же визуальный вес, что и #brand, тем же способом открывается
         клавишей "/" (см. там же), кнопка — для тех, кто не знает про
         горячую клавишу. Единственный способ найти ДЕПАРТАМЕНТ — у него
         нет своей вкладки/узла-кнопки на карте, всего департаментов
         на реальных данных ~60, найти нужный на глаз на карте нереально. */
      #global-search-trigger {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: none;
        color: var(--muted);
        font-size: 12px;
        text-align: left;
        cursor: pointer;
      }
      #global-search-trigger:hover { background: var(--surface-2); color: var(--text); }
      .global-search-trigger__hint {
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: monospace;
        font-size: 11px;
      }

      /* Окно глобального поиска — полноэкранный оверлей поверх ВСЕГО,
         включая меню (z-index больше, чем у #menu) — доступен и с меню, и
         из приложения, клавишей "/" в любой момент. */
      #global-search {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 12vh;
        background: rgba(0, 0, 0, 0.55);
      }
      #global-search[hidden] { display: none; }
      .global-search-box {
        width: min(560px, calc(100vw - 32px));
        max-height: 60vh;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        overflow: hidden;
      }
      .global-search-input {
        width: 100%;
        box-sizing: border-box;
        padding: 16px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: none;
        color: var(--text);
        font-size: 16px;
      }
      #global-search-results { overflow-y: auto; }

      /* Кнопки переключения вкладок — по одной на каждый TabModule из
         features/tabs/index.ts. "Здоровье БД" из старого GUI сознательно
         не переносим — для неё кнопки нет и не будет. */
      #tab-buttons { display: flex; border-bottom: 1px solid var(--border); }
      #tab-buttons button {
        flex: 1;
        padding: 10px 4px;
        border: none;
        background: none;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        border-bottom: 2px solid transparent;
      }
      #tab-buttons button.tab-button--active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

      /* Регуляторы порогов фильтрации (features/filters.ts) — видны только
         для вкладок, у которых вообще есть фильтр (сейчас 1 и 3). */
      #filter-bar { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); }
      #filter-bar[hidden] { display: none; }
      .filter-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .filter-row__label { flex-shrink: 0; color: var(--muted); }
      /* min-width: 0 обязателен — без него flex-элемент с nowrap-содержимым
         (тут это встроенный вид ползунка) не сжимается меньше своей
         "естественной" ширины и выталкивает строку за пределы сайдбара,
         когда подпись слева длинная (например "Мин. общих авторов"). */
      .filter-row input[type="range"] { flex: 1; min-width: 0; }
      .filter-row__value { flex-shrink: 0; min-width: 2.5em; text-align: right; color: var(--text); }

      /* Список карточек внутри активной вкладки — отрисовывается через
         core/render.ts::renderList(), см. features/tabs/authors.ts. */
      #tab-content { flex: 1; overflow-y: auto; }
      /* Поле поиска по сущностям ТЕКУЩЕЙ вкладки (features/tabs/nodeListTab.ts)
         — под фильтрами, над списком (см. #filter-bar выше). Sticky —
         не должно скроллиться вместе со списком, иначе для правки запроса
         пришлось бы скроллить назад наверх. */
      .tab-search {
        position: sticky;
        top: 0;
        width: 100%;
        box-sizing: border-box;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
        background: var(--surface);
        color: var(--text);
      }
      .tab-list-item {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-bottom: 1px solid var(--border);
        background: none;
        color: var(--text);
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .tab-list-item:hover { background: var(--surface-2); }
      .tab-list-item--selected { background: var(--accent-soft); }
      /* min-width: 0 — та же причина, что у .filter-row input выше: без
         него текст с white-space: nowrap не сжимается и вылезает за край
         строки (в поиске это выглядело как "буквы не отображаются" —
         текст на самом деле рисовался, просто за пределами видимой
         ширины сайдбара). */
      .tab-list-item__label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tab-list-item__meta { flex-shrink: 0; color: var(--muted); }
      /* "Ничего не найдено" (features/tabs/nodeListTab.ts) — раньше пустой
         результат поиска выглядел как пустая/сломанная страница, без
         единой подсказки, что список просто отфильтрован в ноль. */
      .tab-empty { padding: 24px 12px; text-align: center; color: var(--muted); font-size: 13px; }

      /* В обычных вкладках meta — короткое число ("42", "★ 15", "2024"),
         поэтому в один ряд с подписью оно умещается нормально. В
         глобальном поиске (features/globalSearch.ts, .search-results ниже)
         meta — целая строка вида "Институт прикладных систем · 4 публ.",
         и рядом с длинной подписью в одну строку оба не влезают: подпись
         сжималась почти до нуля и рвалась по одной букве на строку.
         Решение — не бороться за одну строку, а класть подпись и meta
         друг под другом, как заголовок и подзаголовок результата поиска. */
      .search-results .tab-list-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .search-results .tab-list-item__label { white-space: normal; }
      .search-results .tab-list-item__meta { font-size: 12px; }

      /* Панель информации о выбранном (или "Обзор" по умолчанию) — третья
         flex-колонка #app, того же вида и ширины, что и #sidebar, только
         зеркально (граница слева, а не справа). Раньше была плавающей
         карточкой поверх карты (position: absolute) — теперь полноценный
         сайдбар, по прямой просьбе ("такой же панелью как и слева с таким
         же размером"). */
      #panel {
        width: 280px;
        flex-shrink: 0;
        overflow-y: auto;
        background: var(--surface);
        border-left: 1px solid var(--border);
        padding: 12px 16px;
        color: var(--text);
        font-size: 13px;
      }
      #panel[hidden] { display: none; }
      #panel h3 { margin: 0 0 8px; font-size: 14px; }
      #panel dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; }
      #panel dt { color: var(--muted); }
      #panel dd { margin: 0; }
      #panel a { color: var(--accent); }
      /* Ссылка на ДРУГУЮ сущность графа внутри карточки (features/panels.ts::PanelEntityRef)
         — визуально то же самое, что и внешняя <a> выше (тот же цвет), но
         это настоящая <button>: клик не открывает вкладку, а делает эту
         сущность новым store.selection ("прослеживать связи" одним кликом,
         см. map/build.ts::flyToSelection). font/цвет наследуются от dd, а не
         от браузерного дефолта кнопки. */
      .panel-entity-ref {
        font: inherit;
        color: var(--accent);
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        text-decoration: none;
      }
      .panel-entity-ref:hover { text-decoration: underline; }

      /* Индикатор "ещё грузится" (core/dom.ts::createLoadingIndicator) —
         показывается в строке карточки вместо значения, пока detail-файл
         автора/репозитория не домержился (features/panels.ts). Пульсация,
         не вращение — квадрат, а не спиннер, специально попроще. */
      .loading-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: var(--muted);
        border-radius: 2px;
        animation: loading-pulse 1s ease-in-out infinite;
      }
      @keyframes loading-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }

      /* Сообщение о неудачной загрузке graph-data.json (app/main.ts) — если
         его нет вовсе, пока никто не прогнал new_generate/generate_data.py,
         страница иначе выглядела бы просто пустой (кнопки вкладок есть,
         карта белая, ни списков, ни ошибки) без единой подсказки, что не
         так. В отличие от .loading-indicator в карточке — это не "ещё
         грузится", а "не загрузится вообще, пока данных нет на диске". */
      #load-error {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        max-width: 420px;
        padding: 16px 20px;
        background: var(--danger-bg);
        border: 1px solid var(--danger-border);
        border-radius: 8px;
        color: var(--danger-text);
        font-size: 13px;
        text-align: center;
      }
      #load-error[hidden] { display: none; }

      /* ---------- стартовый экран (features/start.ts) ---------- */
      /* boot-screen виден с первого кадра (не ждёт JS), пока грузится
         graph-data.json — прогресс идёт по стадиям (loading/rendering), не
         побайтово, см. features/start.ts::STAGE_PROGRESS. */
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--bg);
        transition: opacity 0.35s ease;
      }
      #boot-screen[hidden] { display: none; }
      .boot-title { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
      .boot-progress { width: 180px; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
      .boot-progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.2s ease-out; border-radius: inherit; }
      .boot-status { font-size: 12px; font-weight: 600; color: var(--muted); }

      /* Меню (features/start.ts) — не одноразовый онбординг, а настоящий
         экран приложения (AppState.screen === "menu"): выбор языка и
         вкладки. Показывается на каждой загрузке страницы без tab= в URL,
         и на него всегда можно вернуться кликом по #brand в сайдбаре. */
      #menu {
        position: fixed;
        inset: 0;
        z-index: 26;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
      }
      #menu[hidden] { display: none; }
      .menu-hero { text-align: center; max-width: 560px; padding: 20px; }
      .menu-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 7px 14px 7px 16px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        text-decoration: none;
        margin-bottom: 24px;
      }
      .menu-badge-arrow { color: var(--muted); }
      .menu-title { font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; color: var(--text); margin: 0 0 16px; }
      .menu-subtitle { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0 auto 28px; max-width: 460px; }
      /* Один вход в приложение (всегда на первую вкладку) — отдельные
         кнопки выбора вкладки на меню убраны по прямой просьбе. */
      .menu-cta {
        padding: 12px 22px;
        background: var(--accent);
        color: #ffffff;
        border: none;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }
      .menu-cta:hover { opacity: 0.9; }
      /* Языковые кнопки — переехали сюда из бывшего #lang-toggle. */
      .menu-lang { display: flex; gap: 8px; justify-content: center; margin-top: 20px; }
      .menu-lang button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .menu-lang button.menu-lang--active { color: var(--text); border-color: var(--accent); }
    </style>
  </head>
  <body>
    <!-- Стартовый экран (features/start.ts) — виден с первого кадра, до
         того как JS вообще успевает что-то смонтировать. -->
    <div id="boot-screen">
      <div class="boot-title">PAUK</div>
      <div class="boot-progress"><div class="boot-progress-bar" id="boot-progress-bar"></div></div>
      <div class="boot-status" id="boot-status"></div>
    </div>
    <!-- Меню (features/start.ts) — видимость переключается им же по
         AppState.screen, hidden здесь только страховка на первый кадр до
         запуска JS (тот же смысл, что был у #welcome-modal). -->
    <div id="menu" hidden>
      <div class="menu-hero">
        <a class="menu-badge" href="https://github.com/ITMO-NSS-team/PAUK" target="_blank" rel="noopener noreferrer">
          <span id="menu-badge-text"></span> <span class="menu-badge-arrow">›</span>
        </a>
        <h1 class="menu-title" id="menu-title"></h1>
        <p class="menu-subtitle" id="menu-subtitle"></p>
        <!-- Один вход в приложение (всегда на первую вкладку) — не три
             отдельные кнопки выбора вкладки, как было раньше (убрано по
             прямой просьбе). Текст ставит features/start.ts. -->
        <button type="button" id="menu-enter" class="menu-cta"></button>
        <div class="menu-lang">
          <button type="button" data-lang="ru">RU</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <!-- hidden ставит и снимает features/start.ts по AppState.screen, но
         визуально это ни на что не влияет (см. #app в <style> выше) —
         #map должен иметь настоящие ненулевые размеры уже в момент
         конструирования Sigma, даже если сейчас показано меню. -->
    <div id="app" hidden>
      <aside id="sidebar">
        <!-- Заголовок сайдбара — клик возвращает в меню (features/start.ts). -->
        <button type="button" id="brand">PAUK</button>
        <!-- Открывает глобальный поиск (features/globalSearch.ts) — тот же
             результат, что и клавиша "/" в любой момент. Единственный
             способ найти департамент: у него нет своей вкладки/узла-кнопки
             на карте. Текст ставит сама фича (локализация + горячая клавиша). -->
        <button type="button" id="global-search-trigger"></button>
        <!-- data-tab на каждой кнопке — единственное, что нужно
             features/tabs/index.ts::mountTabs() для переключения. -->
        <nav id="tab-buttons">
          <button type="button" data-tab="1">Авторы</button>
          <button type="button" data-tab="3">Публикации</button>
          <button type="button" data-tab="2">Репозитории</button>
        </nav>
        <!-- Заполняется через features/filters.ts::mountFilters(); пусто и
             скрыто, пока не смонтирована активная вкладка с фильтром. -->
        <div id="filter-bar" hidden></div>
        <div id="tab-content"></div>
      </aside>
      <div id="map"></div>
      <!-- Карточка с информацией о выбранном узле (или карточка "Обзор" по
           умолчанию, пока ничего не выбрано) — заполняется через
           features/panels.ts::mountPanel(). hidden снимается им же сразу
           при монтировании, до этого момента (загрузка фикстур) не показываем
           пустую рамку. -->
      <aside id="panel" hidden></aside>
    </div>
    <!-- Глобальный поиск (features/globalSearch.ts) — ВНЕ #app и #menu:
         открывается клавишей "/" из любого экрана (z-index выше обоих). -->
    <div id="global-search" hidden>
      <div class="global-search-box">
        <input type="search" id="global-search-input" class="global-search-input" />
        <div id="global-search-results" class="search-results"></div>
      </div>
    </div>
    <!-- Показывается только если graph-data.json вообще не загрузился
         (см. комментарий в <style> выше) — app/main.ts снимает hidden. -->
    <div id="load-error" hidden></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
