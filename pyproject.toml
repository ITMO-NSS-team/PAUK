[project]
name = "pauk"
version = "0.1.0"
description = "Links extractor"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "networkx>=3.6.1",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "tqdm>=4.67.1",
    "watchdog>=6.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# The embedding model for `pauk search` (pulls in torch, several GB). Without
# it the search still works, in BM25 mode only.
search = [
    "sentence-transformers>=5.0",
]

[project.scripts]
pauk = "pauk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pauk"]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "mongomock>=4.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 119
target-version = "py312"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

ignore = [
    "E501",  # line length
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["F401"]  # unused imports are fine here

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
