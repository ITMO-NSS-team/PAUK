[project]
name = "pauk"
version = "0.1.0"
description = "Links extractor"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "networkx>=3.6.1",
    "neo4j>=6.2.0",
    "pydantic>=2.13.4",
    "pymongo>=4.17.0",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "scipy>=1.17.1",
    "watchdog>=6.0.0",
]

[project.scripts]
pauk = "pauk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pauk"]

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 119
target-version = "py312"

exclude = [
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

ignore = [
    "E501",  # line length
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["F401"]  # unused imports are fine here

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
