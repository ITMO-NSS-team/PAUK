{% macro change(field, was, now) %}
<div class="change">
  <b>{{ field }}</b>
  {% if was is not none %}<span class="was{% if was|is_long %} clipped{% endif %}">{{ was }}</span>{% endif %}
  {% if now is not none %}<span class="now{% if now|is_long %} clipped{% endif %}">{{ now }}</span>{% endif %}
  {% if was is none and now is none %}<span class="muted">–</span>{% endif %}
</div>
{% endmacro %}
