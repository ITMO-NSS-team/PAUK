<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin PAUK</title>
  <link rel="icon" type="image/jpeg" sizes="any" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/panel.css">
</head>
<body>
{% if user %}
<header>
  <a href="/" class="logo" title="Admin PAUK"><img src="/favicon.ico" alt="Admin PAUK"></a>
  <span class="where">/{% block where %}{% endblock %}</span>
  <nav>
    <span class="muted">{{ user.login }} · {{ user.role }}</span>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" class="ghost">выйти</button>
    </form>
  </nav>
</header>
{% endif %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
