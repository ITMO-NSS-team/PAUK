{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card narrow">
  <div style="display:flex; align-items:center; gap:11px; margin-bottom:18px">
    <img src="/assets/logo.jpg" alt="" width="34" height="34" style="border-radius:8px">
    <div>
      <div style="font-weight:700; letter-spacing:.04em">PAUK</div>
      <div class="muted">панель редактирования</div>
    </div>
  </div>
  {% if error %}<p class="error">Неверный логин или пароль.</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next|default("/") }}">
    <div style="margin-bottom:14px">
      <label for="login">Логин</label>
      <input type="text" id="login" name="login" autocomplete="username" autofocus required>
    </div>
    <div style="margin-bottom:18px">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" style="width:100%">Войти</button>
  </form>
</div>
{% endblock %}
