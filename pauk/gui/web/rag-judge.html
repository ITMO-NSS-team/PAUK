<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разметка пула RAG</title>
<style>
  :root { --bg: #fff; --fg: #1b1b1b; --muted: #6b6b6b; --line: #e3e3e3; --soft: #f5f5f5;
          --g0: #c0392b; --g1: #d39b26; --g2: #1f7a3f; --focus: #3555e0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333; --soft: #1f1f1f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line);
           flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, input { font: inherit; padding: 4px 6px; background: var(--bg); color: var(--fg);
                  border: 1px solid var(--line); border-radius: 4px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 53px); }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; height: auto; } }
  #questions { overflow: auto; border-right: 1px solid var(--line); }
  .q { padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .q.active { background: var(--soft); }
  .q .meta, .small { color: var(--muted); font-size: 12px; }
  #detail { overflow: auto; padding: 12px 16px 60px; }
  h2 { font-size: 15px; margin: 18px 0 6px; }
  .expected { background: var(--soft); padding: 8px 10px; border-radius: 4px; margin: 6px 0; }
  .item { display: grid; grid-template-columns: auto 1fr; gap: 10px; padding: 8px; border: 1px solid var(--line);
          border-radius: 4px; margin: 6px 0; }
  .item.focus { outline: 2px solid var(--focus); }
  .item.g0 { border-left: 4px solid var(--g0); } .item.g1 { border-left: 4px solid var(--g1); }
  .item.g2 { border-left: 4px solid var(--g2); }
  .grades button { font: inherit; width: 30px; margin-right: 3px; border: 1px solid var(--line);
                   background: var(--bg); color: var(--fg); border-radius: 4px; cursor: pointer; }
  .grades button.on.v0 { background: var(--g0); color: #fff; } .grades button.on.v1 { background: var(--g1); color: #fff; }
  .grades button.on.v2 { background: var(--g2); color: #fff; }
  a { color: var(--focus); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; }
  .bar span { display: block; height: 100%; background: var(--g2); border-radius: 2px; }
  .err { color: var(--g0); }
</style>
</head>
<body>
<header>
  <h1>Разметка пула RAG</h1>
  <label>Прогон <select id="run"></select></label>
  <label>Оценщик <input id="judge" placeholder="вы (judgments.json)" size="18"></label>
  <span class="small">1 / 2 / 3 — оценка 0 / 1 / 2 · 0 — снять · ↑ ↓ — элемент · [ ] — вопрос</span>
  <span id="status" class="small"></span>
</header>
<div class="layout">
  <nav id="questions"></nav>
  <main id="detail"></main>
</div>
<script src="rag-judge.js"></script>
</body>
</html>
