name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Run unit and bench tests
        run: uv run --with pytest pytest tests/ -q
      # Против настоящей базы, а не двойника: половина запросов – Cypher,
      # который двойник не исполняет, и расхождение между ними видно только
      # так. Neo4j поднимает сам testcontainers, Docker на раннере есть.
      - name: Run integration tests against a real Neo4j
        run: >
          uv run --with pytest --with mongomock --with "testcontainers[neo4j]"
          pytest tests/integration -q
