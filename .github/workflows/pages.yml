name: Deploy map to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pauk/gui/web/package-lock.json
      - name: Download the public site data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pages-data --repo "$GITHUB_REPOSITORY" --pattern pages-data.tar.gz
          tar -xzf pages-data.tar.gz -C data/gui/public
      - name: Build the public site
        working-directory: pauk/gui/web
        run: |
          npm ci
          npm run build:public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pauk/gui/web/dist-public
      - id: deployment
        uses: actions/deploy-pages@v4
