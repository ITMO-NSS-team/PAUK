name: Deploy GUI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pauk/gui/web/**"
      - "pauk/gui/data/public/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy redacted data into the site
        run: cp pauk/gui/data/public/*.js pauk/gui/web/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pauk/gui/web
      - id: deployment
        uses: actions/deploy-pages@v4
